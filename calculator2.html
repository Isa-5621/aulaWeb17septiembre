<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <form>
        <h4 id="result"></h4>
        <input type="number" id="1" placeholder="numero 1" >
        <br><br>
        <input  type="number" id="2" placeholder="numero 2" >
        <br><br>
        
        <div id="buttons">
            <button id="soma" onclick="calculate(1)">1</button>
            <button id="resta" onclick="calculate(2)">2</button>
            <button id="divisao" onclick="calculate(3)">3</button>
            <button id="multi" onclick="calculate('somar')">+</button>
            <button onclick="calculate(4)">4</button>
            <button onclick="calculate(5)">5</button>
            <button onclick="calculate(6)">6</button>
            <button onclick="calculate('restar')">-</button>
            <button onclick="calculate(7)">7</button>
            <button onclick="calculate(8)">8</button>
            <button onclick="calculate(9)">9</button>
            <button onclick="calculate('multiplicar')">*</button>
            <button onclick="calculate('.')">.</button>
            <button onclick="calculate(0)">0</button>
            <button onclick="calculate('=')">=</button>
            <button onclick="calculate('dividir')">%</button>
        </div>
        
        </form>
</body>
<script src="calculator2.js"></script>
</html>
